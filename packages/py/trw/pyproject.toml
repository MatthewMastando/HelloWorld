[project]
name = "trw"
version = "0.1.0"
description = "Trading research workspace — deterministic TA engine"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trw"]
